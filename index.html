
<!doctype html>
<html lang="en">
<head>
    <title>Model Viewer</title>
    <meta charset="utf-8">
    <meta name="description" content="3D Model Viewer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
</head>

<body>

    <model-viewer
        src="ICA8.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        tone-mapping="neutral"
        poster="poster.png"
        shadow-intensity="1"
        camera-orbit="-27.2deg 81.42deg 0.9347m"
        field-of-view="30deg"
        auto-rotate>

        <!-- Hotspot 1: Handle -->
        <button
            class="Hotspot"
            slot="hotspot-1"
            data-position="0.08113090329903684m 0.1317448273372188m -0.08942140479540123m"
            data-normal="-0.32288353412199244m 0.00018981302679795705m 0.9464386865317305m"
            data-visibility-attribute="visible"
            onmouseenter="addhotspot1()"
            onmouseleave="removehotspot1()">

            <div class="HotspotAnnotation" id="hotspot1" style="visibility:hidden">
                Handle
            </div>
        </button>

        <!-- Hotspot 2: Spout -->
        <button
            class="Hotspot"
            slot="hotspot-2"
            data-position="-0.005926459250584298m 0.26698877970789064m 0.11893294964359102m"
            data-normal="-0.391115699050288m -3.7044586235683186e-17m 0.920341518109666m"
            data-visibility-attribute="visible"
            onmouseenter="addhotspot2()"
            onmouseleave="removehotspot2()">

            <div class="HotspotAnnotation" id="hotspot2" style="visibility:hidden">
                Spout
            </div>
        </button>

        <!-- Progress Bar -->
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>

        <!-- AR Button -->
        <button slot="ar-button" id="ar-button">
            View in your space
        </button>

        <div id="ar-prompt">
            <img src="ar_hand_prompt.png" alt="AR hand prompt">
        </div>

    </model-viewer>

    <script>
        function addhotspot1() {
            document.getElementById("hotspot1").style.visibility = "visible";
        }

        function removehotspot1() {
            document.getElementById("hotspot1").style.visibility = "hidden";
        }

        function addhotspot2() {
            document.getElementById("hotspot2").style.visibility = "visible";
        }

        function removehotspot2() {
            document.getElementById("hotspot2").style.visibility = "hidden";
        }
    </script>

    <script src="script.js"></script>

    <!-- Load model-viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js">
    </script>

</body>
</html>
